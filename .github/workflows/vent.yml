# Atelier du vent de Mawsim : toutes les heures, regarde si Open-Meteo a publié un nouveau calcul
# d'ICON ; si oui, prépare les tuiles de vent et les publie sur GitHub Pages. Sinon, s'arrête en
# quelques secondes.
#
# Deux temps, séparés :
#   - preparer : le calcul. Écrit le site dans le dossier "site" (prepare.py) et le dépose en artefact "site".
#   - publier-pages : la publication. Reprend l'artefact, le vérifie (publier.py) et le publie sur GitHub Pages.
# Un autre hébergement (Cloudflare) s'ajoute comme un job de plus qui reprend le même artefact : voir le modèle en
# commentaire au bout du fichier.
name: Vent

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      forcer:
        description: Refaire les tuiles même si le calcul est déjà publié
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Un seul passage à la fois ; celui qui tourne va à son terme.
concurrency:
  group: vent
  cancel-in-progress: false

env:
  MODELE: dwd_icon
  SOURCE: https://openmeteo.s3.us-west-2.amazonaws.com/data_spatial

jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      publier: ${{ steps.nouveau.outputs.publier }}
    steps:
      # GitHub coupe les tâches planifiées d'un dépôt resté 60 jours sans activité : réactiver la tâche
      # à chaque passage la garde en vie, sans commit.
      - name: Garder la tâche en vie
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/vent.yml/enable" || true

      - name: Y a-t-il un nouveau calcul ?
        id: nouveau
        run: |
          publie="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/index.json"
          dernier=$(curl -fsS --max-time 30 "$SOURCE/$MODELE/latest.json")
          complet=$(echo "$dernier" | jq -r '.completed')
          calcul=$(echo "$dernier" | jq -r '.reference_time' | cut -c1-16)Z
          en_ligne=$(curl -fsS --max-time 30 "$publie" | jq -r '.run' || echo "aucun")
          echo "Calcul chez Open-Meteo : $calcul (complet : $complet) ; en ligne : $en_ligne"
          if [ "${{ inputs.forcer }}" = "true" ] || { [ "$complet" = "true" ] && [ "$calcul" != "$en_ligne" ]; }; then
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          else
            echo "publier=non" >> "$GITHUB_OUTPUT"
          fi
          echo "publie=$publie" >> "$GITHUB_OUTPUT"
          # L'heure à laquelle l'atelier voit ce calcul complet : elle va dans l'index (champ "received").
          echo "vu=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.nouveau.outputs.publier == 'oui'

      - uses: actions/setup-python@v7
        if: steps.nouveau.outputs.publier == 'oui'
        with:
          python-version: "3.12"
          cache: pip

      # Le danger de feu ne change qu'une fois par jour : ses tuiles (f/) et leur entrée d'index sont gardées
      # dans un cache, une clé par jour UTC. feu.py les reprend tant que le serveur n'a rien publié de neuf.
      - name: Jour UTC du feu
        id: jour
        if: steps.nouveau.outputs.publier == 'oui'
        run: echo "jour=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        id: feu-avant
        if: steps.nouveau.outputs.publier == 'oui'
        with:
          path: feu-cache
          key: feu-${{ steps.jour.outputs.jour }}-
          restore-keys: feu-${{ steps.jour.outputs.jour }}-

      - name: Préparer les tuiles
        if: steps.nouveau.outputs.publier == 'oui'
        run: |
          pip install --quiet -r requirements.txt
          python prepare.py site --model "$MODELE" --fire-cache feu-cache --received "${{ steps.nouveau.outputs.vu }}"

      # Une nouvelle clé seulement si les tuiles du feu ont été refaites (leur entrée a changé).
      - name: Clé du feu
        id: feu-apres
        if: steps.nouveau.outputs.publier == 'oui'
        run: |
          if [ -f feu-cache/fire.json ]; then
            echo "cle=feu-${{ steps.jour.outputs.jour }}-$(sha256sum feu-cache/fire.json | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache/save@v6
        if: steps.nouveau.outputs.publier == 'oui' && steps.feu-apres.outputs.cle != '' && steps.feu-apres.outputs.cle != steps.feu-avant.outputs.cache-matched-key
        with:
          path: feu-cache
          key: ${{ steps.feu-apres.outputs.cle }}

      # Le site préparé, tel quel, pour les jobs de publication (un jour de conservation suffit).
      - uses: actions/upload-artifact@v7
        if: steps.nouveau.outputs.publier == 'oui'
        with:
          name: site
          path: site
          retention-days: 1
          if-no-files-found: error

  publier-pages:
    needs: preparer
    if: needs.preparer.outputs.publier == 'oui'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # Vérifie le site (index lisible, tuiles présentes) : un site abîmé n'est pas publié.
      - name: Vérifier le site
        run: python publier.py site --cible github-pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploiement
        uses: actions/deploy-pages@v5

  # Modèle pour l'hébergement Cloudflare (couloir H) : même artefact, un job de plus, sans toucher à "preparer".
  # Le regroupement des tuiles (PMTiles) et l'envoi par wrangler vivent dans une cible "cloudflare" de publier.py.
  #
  # publier-cloudflare:
  #   needs: preparer
  #   if: needs.preparer.outputs.publier == 'oui'
