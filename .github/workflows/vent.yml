# Atelier du vent de Mawsim : regarde si Open-Meteo a publié un nouveau calcul d'ICON ; si oui, prépare les
# tuiles et les publie (GitHub Pages, et Cloudflare quand il est allumé). Sinon, s'arrête en quelques secondes.
#
# Qui le lance :
#   - le minuteur de Cloudflare (cloudflare/minuteur), toutes les cinq minutes, par workflow_dispatch, dès qu'un
#     calcul complet n'est pas en ligne ; il donne la clé du calcul ("icon 2026-11-22T06:00Z") dans l'entrée
#     "calcul", reprise dans le titre du passage pour qu'il compte ses essais ;
#   - la tâche planifiée ci-dessous, filet de secours si le minuteur se tait ;
#   - à la main (workflow_dispatch).
#
# Trois temps, séparés :
#   - preparer : le calcul. Écrit le site dans le dossier "site" (prepare.py) et le dépose en artefact "site".
#   - publier-pages (puis deployer-pages) : reprend l'artefact, le vérifie (publier.py) et le publie sur GitHub Pages.
#   - publier-cloudflare : reprend le même artefact et le publie sur les fichiers statiques des Workers de
#     Cloudflare (publier.py --cible cloudflare). Il ne tourne que si la variable du dépôt CLOUDFLARE_ACTIF vaut "oui".
name: Vent
run-name: ${{ inputs.calcul && format('Vent, {0}', inputs.calcul) || 'Vent' }}

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      forcer:
        description: Refaire les tuiles même si le calcul est déjà publié
        type: boolean
        default: false
      calcul:
        description: Calcul que le minuteur a vu (titre du passage, pour compter ses essais)
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Un seul passage à la fois ; celui qui tourne va à son terme.
concurrency:
  group: vent
  cancel-in-progress: false

env:
  MODELE: dwd_icon
  SOURCE: https://openmeteo.s3.us-west-2.amazonaws.com/data_spatial

jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      publier: ${{ steps.nouveau.outputs.publier }}
    steps:
      # GitHub coupe les tâches planifiées d'un dépôt resté 60 jours sans activité : réactiver la tâche
      # à chaque passage la garde en vie, sans commit.
      - name: Garder la tâche en vie
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/vent.yml/enable" || true

      # Le dépôt d'abord : le contrôle est dans controle.py (essayé par test_controle.py).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Le calcul en ligne est le plus ancien des index publiés : Pages (que lit l'app installée pendant la transition)
      # et Cloudflare quand il est allumé. Un hébergement resté en retard est ainsi rattrapé au passage suivant.
      # L'adresse de Cloudflare vient d'un secret : le sous-domaine du compte ne va pas dans ce dépôt public, et son
      # libellé est masqué dans les journaux.
      - name: Y a-t-il un nouveau calcul ?
        id: nouveau
        env:
          SOUS_DOMAINE: ${{ vars.CLOUDFLARE_ACTIF == 'oui' && secrets.CLOUDFLARE_SOUS_DOMAINE || '' }}
          FORCER: ${{ inputs.forcer }}
        run: |
          pages="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/index.json"
          set -- --index "$pages"
          if [ -n "$SOUS_DOMAINE" ]; then
            echo "::add-mask::${SOUS_DOMAINE%%.*}"
            set -- "$@" --index "https://mawsim-index.${SOUS_DOMAINE}/index.json"
          fi
          if [ "$FORCER" = "true" ]; then set -- "$@" --forcer; fi
          python3 controle.py --source "$SOURCE" --modele "$MODELE" "$@"

      - uses: actions/setup-python@v7
        if: steps.nouveau.outputs.publier == 'oui'
        with:
          python-version: "3.12"
          cache: pip

      # Le danger de feu ne change qu'une fois par jour : ses tuiles (f/) et leur entrée d'index sont gardées
      # dans un cache, une clé par jour UTC. feu.py les reprend tant que le serveur n'a rien publié de neuf.
      - name: Jour UTC du feu
        id: jour
        if: steps.nouveau.outputs.publier == 'oui'
        run: echo "jour=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        id: feu-avant
        if: steps.nouveau.outputs.publier == 'oui'
        with:
          path: feu-cache
          key: feu-${{ steps.jour.outputs.jour }}-
          restore-keys: feu-${{ steps.jour.outputs.jour }}-

      - name: Préparer les tuiles
        if: steps.nouveau.outputs.publier == 'oui'
        run: |
          pip install --quiet -r requirements.txt
          python prepare.py site --model "$MODELE" --fire-cache feu-cache --received "${{ steps.nouveau.outputs.vu }}"

      # Une nouvelle clé seulement si les tuiles du feu ont été refaites (leur entrée a changé).
      - name: Clé du feu
        id: feu-apres
        if: steps.nouveau.outputs.publier == 'oui'
        run: |
          if [ -f feu-cache/fire.json ]; then
            echo "cle=feu-${{ steps.jour.outputs.jour }}-$(sha256sum feu-cache/fire.json | cut -c1-16)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache/save@v6
        if: steps.nouveau.outputs.publier == 'oui' && steps.feu-apres.outputs.cle != '' && steps.feu-apres.outputs.cle != steps.feu-avant.outputs.cache-matched-key
        with:
          path: feu-cache
          key: ${{ steps.feu-apres.outputs.cle }}

      # Le site préparé, tel quel, pour les jobs de publication (un jour de conservation suffit).
      - uses: actions/upload-artifact@v7
        if: steps.nouveau.outputs.publier == 'oui'
        with:
          name: site
          path: site
          retention-days: 1
          if-no-files-found: error
          # Une relance complète du même passage reprend le nom "site" : elle remplace l'artefact au lieu d'échouer.
          overwrite: true
          # Les PNG sont déjà compressés : ne pas les recompresser accélère l'envoi.
          compression-level: 0

  publier-pages:
    needs: preparer
    if: needs.preparer.outputs.publier == 'oui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # Vérifie le site (index lisible, tuiles présentes) : un site abîmé n'est pas publié.
      - name: Vérifier le site
        run: python publier.py site --cible github-pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # La mise en ligne vit dans un job à part, comme avant F2. Lancée dans le même job, juste après l'envoi de
  # l'archive des pages, elle ne la trouvait pas encore (passage du 21 novembre 2026 : "No artifacts named
  # github-pages were found for this workflow run").
  deployer-pages:
    needs: publier-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5

  # Cloudflare (fichiers statiques des Workers) : même artefact, un Worker par famille plus un pour l'index (voir
  # publier.py et le README, "Publication"). Tourne à côté de GitHub Pages pendant la transition ; un échec ici ne
  # retient pas Pages, et inversement.
  publier-cloudflare:
    needs: preparer
    if: needs.preparer.outputs.publier == 'oui' && vars.CLOUDFLARE_ACTIF == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Ce job ne touche pas au dépôt : lecture seule, et aucun identifiant GitHub laissé dans la copie.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # wrangler et toutes ses dépendances, figés par cloudflare/package-lock.json (jamais de npx sans verrou).
      - name: Installer wrangler
        run: npm ci --prefix cloudflare --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site

      # Vérifie le site comme pour Pages, range chaque famille dans le dossier de son Worker, puis envoie les familles
      # qui ont changé (d'après l'empreinte écrite dans chaque Worker) et l'index en dernier.
      - name: Publier sur Cloudflare
        run: |
          echo "::add-mask::${CLOUDFLARE_SOUS_DOMAINE%%.*}"
          python publier.py site --cible cloudflare --dossier cloudflare-envoi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SOUS_DOMAINE: ${{ secrets.CLOUDFLARE_SOUS_DOMAINE }}
