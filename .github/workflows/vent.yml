  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-python@v7
  #       with:
  #         python-version: "3.12"
  #         cache: pip
  #     - uses: actions/download-artifact@v8
  #       with:
  #         name: site
  #         path: site
  #     - run: pip install --quiet -r requirements.txt
