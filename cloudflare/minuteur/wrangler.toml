# Minuteur de l'atelier (voir src/index.js). Déployé une fois par l'utilisateur :
#   npm ci --prefix cloudflare, puis, dans cloudflare/ : npx wrangler deploy --config minuteur/wrangler.toml
# puis ses deux secrets, rangés par l'utilisateur (jamais dans ce dépôt) :
#   npx wrangler secret put GITHUB_TOKEN --config minuteur/wrangler.toml
#   npx wrangler secret put DEPOT --config minuteur/wrangler.toml
# (npx prend alors le wrangler figé par cloudflare/package-lock.json.)
name = "mawsim-minuteur"
main = "src/index.js"
compatibility_date = "2026-11-01"
# Pas d'adresse publique : le minuteur ne sert aucune page, il ne fait que tourner sur son cron.
workers_dev = false

[triggers]
# Toutes les cinq minutes : un des 5 crons de l'offre gratuite. 288 lancements par jour, chacun de quelques
# millisecondes de calcul (le temps passé à attendre les serveurs ne compte pas).
crons = ["*/5 * * * *"]

[vars]
SOURCE = "https://openmeteo.s3.us-west-2.amazonaws.com/data_spatial"
# Le modèle principal, le même que MODELE dans vent.yml, et celui de CAMS.
MODELE = "dwd_icon"
MODELE_CAMS = "cams_global"
GITHUB_API = "https://api.github.com"
BRANCHE = "main"
WORKFLOW = "vent.yml"

# L'index publié, lu par une liaison de service : pas d'adresse en workers.dev à connaître ni à écrire ici.
[[services]]
binding = "INDEX"
service = "mawsim-index"

[observability]
enabled = true
